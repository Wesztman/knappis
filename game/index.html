<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knappis</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1f2430;
        overflow: hidden;
      }
      /* Phaser centres the canvas itself (Scale.CENTER_BOTH); do not add
         flex centring here or the canvas gets offset twice. */
      #game {
        width: 100%;
        height: 100%;
      }
      /* Source link, kept out of the canvas so it never competes with play.
         Plain HTML gives a real link (new tab, middle-click, keyboard) for free.
         Styled like the in-game corner icons: dark mark in a soft white disc.
         Bottom-left: the only corner no scene uses (sound toggle sits bottom-right). */
      #source-link {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 36px;
        height: 36px;
        padding: 7px;
        box-sizing: border-box;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        color: #4a3c38;
        opacity: 0.7;
        transition: opacity 150ms ease;
      }
      #source-link:hover,
      #source-link:focus-visible {
        opacity: 1;
      }
      #source-link svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <a
      id="source-link"
      href="https://github.com/Wesztman/knappis"
      target="_blank"
      rel="noopener"
      aria-label="Source code on GitHub"
      title="Source code on GitHub"
    >
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
